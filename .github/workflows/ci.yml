name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows is new: its failures are shown without turning the whole run red.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: ubuntu-latest
          - os: windows-latest
            experimental: true
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # The version is pinned: a newer clippy adds lints, which turn the CI red without any change
      # of ours. Raise it on purpose, after running clippy with it.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The libraries Tauri links against on Linux.
      - name: Install the Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev patchelf

      # The tests build repositories and compare their files: git must not change line endings.
      - name: Configure git for the tests
        run: |
          git config --global core.autocrlf false
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"

      - run: bun install --frozen-lockfile

      - name: Front end (types, lint, format, tests)
        run: bun run check

      - name: Rust (format, clippy, tests)
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  package:
    name: Package (${{ matrix.os }})
    # Not on every push: it takes a while. Run it by hand, or by tagging a version.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: ubuntu-latest
          - os: windows-latest
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install the Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev patchelf
      - run: bun install --frozen-lockfile
      # Unsigned: signing and notarization are not set up.
      - run: bun run package
      - uses: actions/upload-artifact@v4
        with:
          name: gitsune-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
